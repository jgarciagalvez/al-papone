<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Papone - Potato Shinobi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #222; /* Slightly lighter background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Press Start 2P', cursive;
            color: white;
            overflow: hidden;
        }
        #gameContainer {
            position: relative; /* Needed for absolute positioning of overlays */
            border: 3px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        canvas {
            display: block; /* Prevents extra space below */
            /* Background drawn in JS */
        }
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.2em;
            text-shadow: 2px 2px #000;
        }
        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.8em;
            z-index: 10;
        }
        #gameOverOverlay h2 {
            margin-bottom: 20px;
            color: #FF4444; /* Red game over text */
            text-shadow: 3px 3px #000;
        }
        #gameOverOverlay button {
            font-family: 'Press Start 2P', cursive;
            padding: 15px 30px;
            font-size: 0.8em;
            cursor: pointer;
            background-color: #FFA500; /* Orange */
            color: #fff;
            border: 3px solid #fff;
            border-radius: 5px;
            box-shadow: 0 5px 0 #CD853F; /* Peru */
            transition: all 0.1s ease;
            margin-top: 20px;
        }
         #gameOverOverlay button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #CD853F;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas> 
        <div id="uiOverlay">
            <div id="scoreDisplay">Score: 0</div>
            <!-- Add lives display here later if needed -->
        </div>
        <div id="gameOverOverlay">
            <h2>GAME OVER</h2>
            <div id="finalScoreDisplay">Final Score: 0</div>
            <button id="resetButton">Retry</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
